<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول إلى Roblox</title>
    <style>
        body { background-color: #191b1d; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-image: url('https://tr.rbxcdn.com/00000000000000000000000000000000/420/420/Image/Png'); background-size: cover; }
        .login-container { background: rgba(35, 37, 39, 0.95); padding: 30px; border-radius: 8px; width: 380px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #393b3d; border-radius: 4px; background: #393b3d; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ffffff; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #dddddd; }
        .error-msg { color: #f68888; font-size: 13px; margin-bottom: 15px; text-align: right; border-right: 3px solid #f68888; padding-right: 10px; }
        .links { font-size: 13px; color: #adb5bd; margin-top: 15px; text-decoration: none; display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>تسجيل الدخول إلى Roblox</h1>
        <div class="error-msg">انتهت صلاحية الجلسة. يرجى تسجيل الدخول مرة أخرى.</div>
        <form action="">
            <input type="text" name="username" placeholder="اسم المستخدم/البريد/الهاتف" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>
        <a href="#" class="links">هل نسيت كلمة المرور أو اسم المستخدم؟</a>
        <hr style="border: 0.5px solid #393b3d; margin: 20px 0;">
        <button style="background: #393b3d; color: white; border: 1px solid #ffffff;">تسجيل دخول سريع</button>
    </div>
</body>
</html>
